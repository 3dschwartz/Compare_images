<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bildvergleich</title>
<style>
  :root {
    --bg: #2a2a2c;
    --panel: #343437;
    --line: #4a4a4f;
    --text: #ececea;
    --muted: #a3a3a8;
    --accent: #e8b339;
    --warn: #ff8a65;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0 8px 0 0; }
  button, label.btn {
    font: inherit; color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
  }
  button:hover, label.btn:hover { border-color: var(--muted); }
  button:focus-visible, label.btn:focus-within, .thumb:focus-visible, #stage:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .ctl { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .ctl input[type=range] { accent-color: var(--accent); width: 120px; }
  .hint { margin-left: auto; color: var(--muted); font-size: 13px; }

  #warnings { display: none; }
  #warnings.show { display: block; }
  .warn {
    margin: 0; padding: 8px 16px;
    background: #4a2e26; color: #ffd2c4;
    border-bottom: 1px solid #6b3f33;
  }
  .warn + .warn { border-top: 0; }

  main { flex: 1; min-height: 0; display: flex; position: relative; }
  #stageWrap {
    flex: 1; min-width: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  #stage {
    position: relative;
    background: #000;
    box-shadow: 0 0 0 1px var(--line);
    cursor: pointer;
    user-select: none;
  }
  #stage img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: fill;
    visibility: hidden;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  #stage img.on { visibility: visible; }
  #badge {
    position: absolute; left: 8px; top: 8px;
    background: rgba(0,0,0,.7); color: var(--text);
    padding: 2px 10px; border-radius: 4px; font-size: 13px;
    pointer-events: none;
    max-width: calc(100% - 16px);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  #empty {
    position: absolute; inset: 16px;
    border: 2px dashed var(--line);
    border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; text-align: center; color: var(--muted);
    padding: 24px;
  }
  #empty strong { color: var(--text); font-size: 20px; font-weight: 600; }

  aside {
    width: 220px; flex: none;
    background: var(--panel);
    border-left: 1px solid var(--line);
    overflow-y: auto;
    padding: 10px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .thumb {
    position: relative;
    display: block; width: 100%;
    text-align: left;
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
  }
  .thumb.active { border-color: var(--accent); }
  .thumb img {
    display: block; width: 100%; height: 90px;
    object-fit: contain; background: #000; border-radius: 3px;
  }
  .thumb .name { margin-top: 6px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thumb .meta { font-size: 12px; color: var(--muted); }
  .thumb .meta.bad { color: var(--warn); }
  .thumb .key {
    position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,.7); border-radius: 3px; padding: 0 6px; font-size: 12px;
  }
  .thumb .rm {
    position: absolute; top: 10px; right: 10px;
    width: 24px; height: 24px; padding: 0; line-height: 1;
    background: rgba(0,0,0,.7); border-radius: 4px;
  }

  #dropOverlay {
    position: fixed; inset: 0; display: none;
    background: rgba(232,179,57,.12);
    border: 3px dashed var(--accent);
    align-items: center; justify-content: center;
    font-size: 22px; font-weight: 600;
    z-index: 10; pointer-events: none;
  }
  #dropOverlay.show { display: flex; }

  @media (max-width: 700px) {
    main { flex-direction: column; }
    aside { width: auto; flex-direction: row; border-left: 0; border-top: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; }
    .thumb { width: 150px; flex: none; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Bildvergleich</h1>
  <label class="btn">Bilder wählen
    <input id="file" type="file" accept="image/jpeg,image/webp,.jpg,.jpeg,.webp" multiple hidden>
  </label>
  <button id="auto" type="button" aria-pressed="false">Auto-Wechsel</button>
  <label class="ctl">Intervall
    <input id="interval" type="range" min="100" max="2000" step="50" value="500">
    <span id="intervalVal">500 ms</span>
  </label>
  <button id="clear" type="button">Alle entfernen</button>
  <span class="hint">Leertaste / Klick = weiter · ← → = wechseln · 1–9 = Bild · F = Auto</span>
</header>

<div id="warnings" role="alert"></div>

<main>
  <div id="stageWrap">
    <div id="stage" tabindex="0" hidden aria-label="Bildvergleich. Klick oder Leertaste wechselt zum nächsten Bild."></div>
    <div id="empty">
      <strong>Mindestens zwei Bilder hierher ziehen</strong>
      <span>JPG oder WebP, ähnliches Seitenverhältnis (Abweichung höchstens 2 Pixel)</span>
      <span>Das größte Bild bestimmt die Anzeigegröße.</span>
    </div>
  </div>
  <aside id="list" aria-label="Geladene Bilder"></aside>
</main>

<div id="dropOverlay">Bilder hier ablegen</div>

<script>
(() => {
  'use strict';

  const TOLERANCE_PX = 2;                       // erlaubte Abweichung in Pixeln
  const ALLOWED = ['image/jpeg', 'image/webp'];
  const ALLOWED_EXT = /\.(jpe?g|webp)$/i;

  const $ = (id) => document.getElementById(id);
  const stage = $('stage'), empty = $('empty'), list = $('list');
  const warningsEl = $('warnings'), overlay = $('dropOverlay');
  const autoBtn = $('auto'), intervalEl = $('interval'), intervalVal = $('intervalVal');

  /** @type {{id:number,name:string,url:string,w:number,h:number,img:HTMLImageElement}[]} */
  let items = [];
  let current = 0;
  let nextId = 1;
  let timer = null;
  let notices = [];   // Hinweise zu abgelehnten Dateien

  /* ---------- Laden ---------- */

  function isAllowed(file) {
    return ALLOWED.includes(file.type) || ALLOWED_EXT.test(file.name);
  }

  function loadImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => resolve({
        id: nextId++, name: file.name, url,
        w: img.naturalWidth, h: img.naturalHeight, img
      });
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(file.name)); };
      img.src = url;
    });
  }

  async function addFiles(fileList) {
    const files = [...fileList];
    notices = [];
    const valid = files.filter((f) => {
      if (isAllowed(f)) return true;
      notices.push(`„${f.name}“ wurde ignoriert: nur JPG und WebP sind erlaubt.`);
      return false;
    });
    const results = await Promise.allSettled(valid.map(loadImage));
    results.forEach((r, i) => {
      if (r.status === 'fulfilled') items.push(r.value);
      else notices.push(`„${valid[i].name}“ konnte nicht geladen werden.`);
    });
    render();
  }

  function removeItem(id) {
    const i = items.findIndex((it) => it.id === id);
    if (i < 0) return;
    URL.revokeObjectURL(items[i].url);
    items.splice(i, 1);
    if (current >= items.length) current = Math.max(0, items.length - 1);
    notices = [];
    render();
  }

  function clearAll() {
    items.forEach((it) => URL.revokeObjectURL(it.url));
    items = []; current = 0; notices = [];
    render();
  }

  /* ---------- Analyse ---------- */

  function reference() {
    // Größtes Bild = maßgeblich (nach Pixelfläche, bei Gleichstand das erste)
    return items.reduce((best, it) => (!best || it.w * it.h > best.w * best.h ? it : best), null);
  }

  // Skaliert das Bild auf die Breite der Referenz und misst, wie viele Pixel
  // die Höhe von der Referenz abweicht (und umgekehrt, je nachdem was größer ist).
  function deviationPx(it, ref) {
    const scaledH = ref.w * it.h / it.w;
    const scaledW = ref.h * it.w / it.h;
    return Math.max(Math.abs(scaledH - ref.h), Math.abs(scaledW - ref.w));
  }

  /* ---------- Rendering ---------- */

  function render() {
    const hasItems = items.length > 0;
    empty.hidden = hasItems;
    stage.hidden = !hasItems;
    empty.style.display = hasItems ? 'none' : '';

    const ref = reference();
    const msgs = [...notices.map((t) => ({ t }))];
    if (items.length === 1) msgs.push({ t: 'Für einen Vergleich wird mindestens ein weiteres Bild benötigt.' });

    const dev = new Map();
    if (ref) {
      for (const it of items) {
        const d = deviationPx(it, ref);
        dev.set(it.id, d);
        if (it !== ref && d > TOLERANCE_PX) {
          msgs.push({ t: `„${it.name}“ hat ein anderes Seitenverhältnis als „${ref.name}“ (Abweichung ca. ${d.toFixed(1)} px bei Referenzgröße). Der Vergleich ist nicht aussagekräftig.` });
        }
      }
    }
    warningsEl.className = msgs.length ? 'show' : '';
    warningsEl.innerHTML = '';
    msgs.forEach((m) => {
      const p = document.createElement('p');
      p.className = 'warn';
      p.textContent = m.t;
      warningsEl.appendChild(p);
    });

    // Bühne: alle Bilder übereinander, sichtbar ist nur eins
    stage.querySelectorAll('img').forEach((n) => n.remove());
    if (ref) {
      stage.dataset.w = ref.w; stage.dataset.h = ref.h;
      items.forEach((it, i) => {
        const img = document.createElement('img');
        img.src = it.url; img.alt = it.name; img.draggable = false;
        if (i === current) img.classList.add('on');
        stage.appendChild(img);
      });
      let badge = $('badge');
      if (!badge) { badge = document.createElement('div'); badge.id = 'badge'; }
      stage.appendChild(badge);
      fitStage();
    }

    // Seitenleiste
    list.innerHTML = '';
    items.forEach((it, i) => {
      const b = document.createElement('div');
      b.className = 'thumb' + (i === current ? ' active' : '');
      b.tabIndex = 0;
      b.setAttribute('role', 'button');
      const d = dev.get(it.id) ?? 0;
      const bad = it !== ref && d > TOLERANCE_PX;
      b.innerHTML = `
        <img alt="">
        <span class="key"></span>
        <button class="rm" type="button" aria-label="Entfernen">×</button>
        <div class="name"></div>
        <div class="meta${bad ? ' bad' : ''}"></div>`;
      b.querySelector('img').src = it.url;
      b.querySelector('.key').textContent = i < 9 ? String(i + 1) : '';
      b.querySelector('.name').textContent = it.name;
      b.querySelector('.meta').textContent =
        `${it.w} × ${it.h}` + (it === ref ? ' · Referenz' : bad ? ' · Seitenverhältnis weicht ab' : '');
      b.addEventListener('click', () => show(i));
      b.addEventListener('keydown', (e) => {
        if (e.target === b && (e.key === 'Enter')) show(i);
      });
      b.querySelector('.rm').addEventListener('click', (e) => { e.stopPropagation(); removeItem(it.id); });
      list.appendChild(b);
    });

    updateBadge();
    if (items.length < 2) stopAuto();
  }

  function fitStage() {
    const w = +stage.dataset.w, h = +stage.dataset.h;
    if (!w || !h) return;
    const wrap = $('stageWrap');
    const availW = wrap.clientWidth - 32;
    const availH = wrap.clientHeight - 32;
    const scale = Math.min(availW / w, availH / h);   // darf auch hochskalieren
    stage.style.width = Math.max(1, Math.floor(w * scale)) + 'px';
    stage.style.height = Math.max(1, Math.floor(h * scale)) + 'px';
  }

  function updateBadge() {
    const badge = $('badge');
    if (!badge || !items[current]) return;
    badge.textContent = `${current + 1}/${items.length} · ${items[current].name}`;
  }

  function show(i) {
    if (!items.length) return;
    current = (i + items.length) % items.length;
    const imgs = stage.querySelectorAll('img');
    imgs.forEach((n, k) => n.classList.toggle('on', k === current));
    [...list.children].forEach((n, k) => n.classList.toggle('active', k === current));
    updateBadge();
  }

  /* ---------- Auto-Wechsel ---------- */

  function startAuto() {
    if (items.length < 2) return;
    stopAuto();
    timer = setInterval(() => show(current + 1), +intervalEl.value);
    autoBtn.setAttribute('aria-pressed', 'true');
  }
  function stopAuto() {
    if (timer) clearInterval(timer);
    timer = null;
    autoBtn.setAttribute('aria-pressed', 'false');
  }
  function toggleAuto() { timer ? stopAuto() : startAuto(); }

  autoBtn.addEventListener('click', toggleAuto);
  intervalEl.addEventListener('input', () => {
    intervalVal.textContent = intervalEl.value + ' ms';
    if (timer) startAuto();
  });
  $('clear').addEventListener('click', clearAll);

  /* ---------- Eingaben ---------- */

  stage.addEventListener('click', () => { stopAuto(); show(current + 1); });

  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input[type=range]')) return;
    if (e.target.closest('button, .thumb') && (e.key === ' ' || e.key === 'Enter')) return;
    if (!items.length) return;
    if (e.key === ' ') { e.preventDefault(); stopAuto(); show(current + 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); stopAuto(); show(current + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stopAuto(); show(current - 1); }
    else if (/^[1-9]$/.test(e.key) && +e.key <= items.length) { stopAuto(); show(+e.key - 1); }
    else if (e.key.toLowerCase() === 'f') toggleAuto();
  });

  $('file').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });

  // Drag & Drop auf das gesamte Fenster
  let dragDepth = 0;
  const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  window.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; overlay.classList.add('show'); });
  window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('dragleave', (e) => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) overlay.classList.remove('show'); });
  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0; overlay.classList.remove('show');
    addFiles(e.dataTransfer.files);
  });

  window.addEventListener('resize', fitStage);
  new ResizeObserver(fitStage).observe($('stageWrap'));

  render();
})();
</script>
</body>
</html>
